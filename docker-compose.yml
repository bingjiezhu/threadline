services:
  threadline:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      THREADLINE_DB: /app/.data/threadline.sqlite
    volumes:
      - threadline-data:/app/.data
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  threadline-data:
